<script>
let currentImage = '';
let overlayData = null;
let imageEl = null;
let panX = 0;
let panY = 0;
let zoom = 1;
let lastTransform = '';

let lastImageTransform = '';



function startTransformSync() {
  let last = { transform: '', width: 0, height: 0, left: 0, top: 0 };

  function sync() {
    const $img = $('#imageViewerContainer img');
    const $overlay = $('#overlayContainer');

    if ($img.length && $overlay.length) {
      const transform = $img.css('transform');
      const width = $img.width();
      const height = $img.height();
      const left = parseFloat($img.css('left')) || 0;
      const top = parseFloat($img.css('top')) || 0;

      // If any visual changes happened (transform or size/position)
      const changed =
        transform !== last.transform ||
        width !== last.width ||
        height !== last.height ||
        left !== last.left ||
        top !== last.top;

      if (changed) {
        // Sync overlay container
        $overlay.css({
          transform,
          transformOrigin: '0 0',
          left: `${left}px`,
          top: `${top}px`,
          width: `${width}px`,
          height: `${height}px`
        });

        // Also redraw overlays using new width/height
        drawOverlay();

        // Cache
        last = { transform, width, height, left, top };
      }
    }

    requestAnimationFrame(sync);
  }

  requestAnimationFrame(sync);
}

function loadMainImage(imagePath, jsonPath) {
  const $viewer = $('#imageViewerContainer').html('');

  const $overlay = $('<div id="overlayContainer"></div>').css({
    position: 'absolute',
    top: 0,

    height: '100%',
    pointerEvents: 'none',
    zIndex: 99
  });
  $viewer.append($overlay);

  $viewer.verySimpleImageViewer({
    imageSource: imagePath,
    frame: ['100%', '100%'],
    maxZoom: '900%',
    zoomFactor: '10%',
    mouse: true,
    keyboard: true,
    toolbar: true,
    rotateToolbar: false,
    saveZoomPos: true,
    //callback: () => {
      //startTransformSync(); // ✅ Keep overlay in sync
    //}
  });
	const onLoad = () => {
 fetch(jsonPath)
  .then(res => res.json())
  .then(json => {
    overlayData = json;
    drawOverlay();
    trackImageTransformSync();  // ✅ this keeps it always synced
  });

  setupDrag();
};
  setTimeout(() => {
    const $img = $('#imageViewerContainer img');
    if ($img.length) {
      imageEl = $img[0];

      const onLoad = () => {
        fetch(jsonPath)
          .then(res => res.json())
          .then(json => {
            overlayData = json;
            drawOverlay();
            applyTransform(); // ✅ align on first load
          });

        setupDrag(); // 🟢 optional: enable manual pan
      };

      if (imageEl.complete) {
        onLoad();
      } else {
        $img.on('load', onLoad);
      }
    }
  }, 300);
}


function applyTransform() {
  const $img = $('#imageViewerContainer img');

  if (!$img.length) return;

  const left = parseFloat($img.css('left')) || 0;
  const top = parseFloat($img.css('top')) || 0;
  const renderedWidth = $img.width();
  const naturalWidth = imageEl?.naturalWidth || renderedWidth;

  zoom = renderedWidth / naturalWidth;

  // Move overlay to match image position
  $('#overlayContainer').css({
    left: `${left}px`,
    top: `${top}px`,
    width: `${renderedWidth}px`,
    height: `${$img.height()}px`
  });

  // 🔄 Update overlay boxes to match current zoom
  drawOverlay();
}

function setupDrag() {
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };

  const viewer = document.getElementById('imageViewerContainer');

  viewer.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;

    panX += dx;
    panY += dy;
    dragStart = { x: e.clientX, y: e.clientY };

    const container = document.getElementById('imageViewerContainer');
    const clamped = clampPan(
      panX, panY, zoom,
      container.clientWidth,
      container.clientHeight,
      imageEl.naturalWidth,
      imageEl.naturalHeight
    );
    panX = clamped.x;
    panY = clamped.y;

    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });
}

function clampPan(panX, panY, zoom, containerWidth, containerHeight, imageWidth, imageHeight) {
  const zoomedWidth = imageWidth * zoom;
  const zoomedHeight = imageHeight * zoom;

  const minX = containerWidth - zoomedWidth;
  const minY = containerHeight - zoomedHeight;

  return {
    x: Math.min(0, Math.max(minX, panX)),
    y: Math.min(0, Math.max(minY, panY))
  };
}

function drawOverlay() {
  const overlay = document.getElementById('overlayContainer');
  if (!imageEl || !overlayData || !overlay) return;

  // Remove previous overlays
  overlay.innerHTML = '';

  const renderedWidth = imageEl.offsetWidth;
  const renderedHeight = imageEl.offsetHeight;

  overlayData.blocks.forEach(block => {
    block.lines.forEach(line => {
      line.words.forEach(word => {
        const [[x0, y0], [x1, y1]] = word.geometry;
        const confidence = word.confidence || 0;
        const color = confidence < 0.7 ? 'red' : 'green';
        const bgColor = confidence < 0.7 ? 'rgba(255,0,0,0.05)' : 'rgba(0,255,0,0.05)';

        const left = x0 * renderedWidth;
        const top = y0 * renderedHeight;
        const width = (x1 - x0) * renderedWidth;
        const height = (y1 - y0) * renderedHeight;

        const div = document.createElement('div');
        div.className = 'wordBox';
		div.dataset.key = word.id || `${x0}-${y0}-${x1}-${y1}`;
        Object.assign(div.style, {
          position: 'absolute',
          left: `${left}px`,
          top: `${top}px`,
          width: `${width}px`,
          height: `${height}px`,
          //border: `1px dashed ${color}`,
          //backgroundColor: bgColor,
          //fontSize: '12px',
          color: 'transparent',
          zIndex: 100
        });

        div.title = `${word.value} (Conf: ${confidence.toFixed(2)})`;
        div.textContent = word.value;
        overlay.appendChild(div);

      });
    });
  });
}



// Load JSON dynamically (replace path to match yours)
fetch('{{ url_for('static', filename='json/ocr_filtered1_new.json') }}') // 👈 Replace path if needed
  .then(res => res.json())
  .then(data => {
    const canvas = document.getElementById('ocrCanvas');

    const canvasHeight = canvas.clientHeight;

    data.blocks.forEach(block => {
      block.lines.forEach(line => {
        line.words.forEach(word => {
          const [[x0, y0], [x1, y1]] = word.geometry;
          const left = x0 * canvasWidth;
          const top = y0 * canvasHeight;
          const width = (x1 - x0) * canvasWidth;
          const height = (y1 - y0) * canvasHeight;

          const confidence = word.confidence || 0;
          const borderColor = confidence < 0.7 ? 'red' : 'rgba(255,0,0,0.1)';
          //const backgroundColor = confidence < 0.7 ? 'rgba(255,0,0,0.1)' : 'rgba(0,255,0,0.1)';

          const div = document.createElement('div');
          div.className = 'canvasWordBox';
		  div.dataset.key = word.id || `${x0}-${y0}-${x1}-${y1}`;
		  div.addEventListener('click', () => {
			  // Remove old highlight
			  document.querySelectorAll('#overlayContainer .highlight').forEach(el => {
				el.classList.remove('highlight');
			  });

			  // Highlight the matching overlay word
			  const selector = `#overlayContainer [data-key="${div.dataset.key}"]`;
			  const target = document.querySelector(selector);
			  if (target) {
				target.classList.add('highlight');
				const container = document.getElementById('imageViewerContainer');
				const overlayBox = target.getBoundingClientRect();
				const containerBox = container.getBoundingClientRect();

				const scrollX = overlayBox.left - containerBox.left - container.clientWidth / 2 + overlayBox.width / 2;
				const scrollY = overlayBox.top - containerBox.top - container.clientHeight / 2 + overlayBox.height / 2;

				container.scrollBy({
				  top: scrollY,
				  left: scrollX,
				  behavior: 'smooth'
				});
			  }
		  });

          div.style.position = 'absolute';
          div.style.left = `${left}px`;
          div.style.top = `${top}px`;
          div.style.width = `${width}px`;
          div.style.height = `${height}px`;
          div.style.border = `1px solid ${borderColor}`;
          //div.style.backgroundColor = backgroundColor;
          //div.style.padding = '2px';
          div.style.fontSize = '12px';
		  div.style.color = 'black';
          //div.style.whiteSpace = 'nowrap';
          //div.style.overflow = 'hidden';
          div.style.zIndex = 10;
          div.contentEditable = true;
		  div.innerText = word.value;

          // Optional tooltip
          div.title = `${word.value} (Confidence: ${confidence.toFixed(2)})`;
		
          canvas.appendChild(div);
        });
      });
    });
  });
  
loadMainImage("/static/images/IMG_4871_1982_8.JPG", "/static/json/ocr_filtered1_new.json");
