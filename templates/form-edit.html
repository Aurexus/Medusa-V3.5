       :root {
            /* Color Palette */
            --primary-bg: #f5f7fa; /* Lightest background */
            --secondary-bg: #ffffff; /* Card/panel background */
            --border-color: #e0e6ed; /* Subtle borders */
            --text-color-dark: #2c3e50; /* Primary text */
            --text-color-medium: #7f8c8d; /* Secondary text, labels */
            --text-color-light: #bdc3c7; /* Placeholder, subtle info */
            --accent-red: #e74c3c; /* Action color */
            --accent-red-hover: #c0392b; /* Darker red on hover */
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.05); /* Light shadow for depth */
            --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.08); /* Stronger shadow for prominent elements */

            /* Spacing */
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 10px;
            --spacing-lg: 30px;

            /* Typography */
            --font-family: 'Inter', sans-serif;
            --font-size-base: 14px;
            --font-size-sm: 12px;
            --font-size-lg: 16px;
                    
            --border-radius-sm: 5px;
            --border-radius-md: 10px;

            /* Transitions */
            --transition-speed: 0.2s ease-in-out;
        }

        #main-content{
            height:89vh;
            width: 100%;
            overflow: hidden;
        }

        .left-panel{
            flex-basis: 50%; 
            max-width: 50%;
            min-width: 450px;
            height:90vh;
            overflow: scroll;
        }

        .right-panel {
            flex-basis: 50%; 
            max-width: 50%;
            min-width: 450px; 
            justify-content: space-between; 
            overflow: scroll;
            height:90vh;
        }

         /* --- Top Navigation Bar (Left Panel) --- */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
            padding-bottom: var(--spacing-xs);
            border-bottom: 1px solid var(--border-color);
            
        }

        .btn-nav {
            background-color: var(--secondary-bg);
            color: var(--text-color-dark);
            border: 1px solid var(--border-color);
            padding: 5px 7px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: var(--font-size-sm);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            transition: background-color var(--transition-speed), border-color var(--transition-speed), box-shadow var(--transition-speed);
        }

        .btn-nav:hover {
            background-color: var(--primary-bg);
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(var(--accent-red), 0.1);
        }

        .btn-nav .icon {
            font-size: 1em; 
        }

        .star-checkbox {
		    display: none;
		}

		.star-label {
		  cursor: pointer;
		  font-size: 24px;
		  /*color: #dedede;*/
		  transition: color 0.2s;
		}

		.star-checkbox:checked + .star-label {
		  color: #e7b63a;
		}

        /* Top right Record btn */

        .nav-btn-record{
            display:flex;
            justify-content: center; 
            align-items: center; 
            background: #5271FF; 
            color: white; 
            padding: 8px 12px; 
        }

        .nav-btn-record .nav-btn-record-span{
            padding: 0 10px; 
            border-right: 3px solid white;
        }

        /* Section */
        .section {
            margin-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--spacing-md);
            width:100%;
        }

        .section:last-of-type {
            border-bottom: none; 
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--text-color-dark);
            /* margin-bottom: var(--spacing-md); */
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

         .section label {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-color-medium);
            text-align: left;
            display: block;
        }

        .section-title .icon {
            font-size: 1.2em; 
        }

         /* --- Form Grid Layout --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: var(--spacing-sm) var(--spacing-md); 
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .form-field.full-width {
            grid-column: 1 / -1; 
        }

        .form-field label {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-color-medium);
            text-align: left;
            display: block;
        }

        .form-field input[type="text"],
        .form-field select,
        .form-field textarea {
            width: 100%;
            padding: 10px var(--spacing-sm);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            color: var(--text-color-dark);
            background-color: var(--primary-bg); /* Slightly darker input background */
            transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
            box-sizing: border-box; /* Include padding and border in element's total width and height */
        }

        .form-field input[type="text"]:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            border-color: var(--accent-red);
            outline: none;
            box-shadow: 0 0 0 3px rgba(var(--accent-red), 0.15);
            background-color: var(--secondary-bg); /* White on focus */
        }

        .form-field textarea {
            min-height: 100px;
            resize: vertical; 
            text-align: left;
        }

        /* --- Specific styles for TextBrut section --- */
        .text-brut-content {
            white-space: pre-wrap; 
            font-family: 'Consolas', 'Monaco', monospace; 
            font-size: var(--font-size-sm);
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            padding: var(--spacing-sm);
            max-height: 200px; /* Limit height if needed */
            overflow-y: auto; /* Scroll if content overflows */
            color: var(--text-color-dark);
        }

        /* --- Specific styles for Notice section --- */
        .notice-content {
            font-size: var(--font-size-sm);
            line-height: 1.4;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            padding: var(--spacing-sm);
            max-height: 150px;
            overflow-y: auto;
            color: var(--text-color-dark);
        }

        .notice-content {
            display: block; 
            white-space: pre-wrap;
        }

        .notice-content a {
            color: var(--accent-red);
            text-decoration: none;
            transition: color var(--transition-speed);
        }

        .notice-content a:hover {
            text-decoration: underline;
            color: var(--accent-red-hover);
        }

        .notice-content a .icon {
            font-size: 0.9em; /* Smaller icon for link */
            margin-left: 5px;
        }


         /* save btn */
        .btn-save {
            background-color: #5271FF;
            color: white;
            border: 1px solid var(--border-color);
            padding: 5px 7px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: var(--font-size-sm);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            transition: background-color var(--transition-speed), border-color var(--transition-speed), box-shadow var(--transition-speed);
            text-align: center;
        }

        .btn-save .icon {
            font-size: 1em; 
            color: green;
        }

        .viewer-header .title-text {
            flex-grow: 1; /* Pushes other elements away */

            font-size: var(--font-size-base);

        /* Custom Checkbox (similar to previous solution) */
        .custom-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            font-size: var(--font-size-sm);
            color: var(--text-color-medium);
        }

        .custom-checkbox input[type="checkbox"] {
            opacity: 0;
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }

        .custom-checkbox .checkmark {
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-right: 8px;
            display: inline-block;
            vertical-align: middle;
            position: relative;
            transition: all var(--transition-speed);
            background-color: var(--primary-bg);
        }

        .custom-checkbox input[type="checkbox"]:checked + .checkmark {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .custom-checkbox input[type="checkbox"]:checked + .checkmark::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Image Placeholder Area */
        .image-viewer-placeholder {
            flex-grow: 1; /* Takes available space */
            background-color: var(--primary-bg);
            border: 1px dashed var(--border-color);
            border-radius: var(--border-radius-sm);

            color: var(--text-color-light);
            font-size: var(--font-size-lg);
            min-height: 250px; /* Minimum height for visual balance */
        }

        /* Thumbnails Area */
        .viewer-footer .thumbnails {
            display: flex;
            gap: var(--spacing-sm);
            overflow-x: auto; /* Allow horizontal scrolling if many thumbs */
            padding-bottom: var(--spacing-xs); /* Padding for scrollbar */
        }

        .viewer-footer .thumbnail-item {
            width: 80px; 
            height: 60px; 
            border: 2px solid transparent;
            border-radius: var(--border-radius-sm);
            overflow: hidden;
            flex-shrink: 0; 
            cursor: pointer;
            transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
            background-color: var(--primary-bg); 
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color-light);
            font-size: var(--font-size-sm);
        }

        .viewer-footer .thumbnail-item.active {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(var(--accent-red), 0.2);
        }

        .viewer-footer .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .icon {
            display: inline-block;
            vertical-align: middle;

    <script>
		$(document).ready(function() {
            const folder = "{{ dossier }}";
			const img_link = "{{ img_link }}";      
			let currentImage = "{{ image }}";
			let fullImageList = [];

			function getImageUrl(imageName) {
			  return `${img_link}/${imageName}`;
			}

			function loadMainImage(imageName) {
			  currentImage = imageName;
			  const imgLink = getImageUrl(imageName);
			  const $viewer = $('#imageViewerContainer').html('');
			  $viewer.verySimpleImageViewer({
				imageSource: imgLink,
				frame: ['100%', '100%'],
				maxZoom: '900%',
				zoomFactor: '10%',
				mouse: true,
				keyboard: true,
				toolbar: true,
				rotateToolbar: false,
				saveZoomPos: true,
				callback(zoom, panX, panY) {
				  localStorage.setItem('imageZoomLevel', zoom);
				  const $img = $viewer.find('img');
				  if ($img.length) {
					localStorage.setItem('imageTranslateY', $img.css('transform'));
				  }
				}
			  });
			  
			  	  	// Reset rotation
			currentRotation = 0;
				// ⏳ Inject rotate button after viewer renders
			setTimeout(() => {
				const $toolbar = $viewer.find('.jqvsiv_toolbar');
				const $img = $viewer.find('.jqvsiv_main_image_content img'); // Target image inside wrapper

				if ($toolbar.length && !$toolbar.find('#rotateBtn').length) {
					const rotateBtn = $(`
						<button id="rotateBtn" class="vsiv-btn btn btn-sm btn-warning" title="Rotate" style="margin-left: 0px;width:25px;height:25px;padding:0px;">
							<i class="fa fa-repeat"></i>
						</button>
					`);

					$toolbar.append(rotateBtn);

					rotateBtn.on('click', function () {
						currentRotation = (currentRotation + 90) % 360;
						const $img = $viewer.find('img');
						if ($img.length) {
							$img.css({
								'transform': `rotate(${currentRotation}deg)`,
								'transform-origin': 'center center',
								'transition': 'transform 0.3s ease-in-out'
							});
						}
					});
				}
			 }, 100); // delay ensures toolbar is rendered
			}

			function preloadThumbnails(imageList, active) {
			  const $thumb = $('#prefetch_image').empty();
			  $('#loading_indicator').show();

			  imageList.forEach(src => {
				const img = $('<img loading="lazy" width="50" height="50">')
				  .attr('src', getImageUrl(src))
				  .addClass('thumbnail-image')
				  .toggleClass('active-thumbnail', src === active)
				  .on('load', () => {
					if ($('#prefetch_image img').length === imageList.length) {
					  $('#loading_indicator').hide();
					}
				  })
				  .on('click', () => {
					if (src !== currentImage) {
					  updateThumbnails(src);
					}
				  });
				$thumb.append(img);
			  });
			}

			function updateThumbnails(activeImage) {
			  $.getJSON(`/api/images/${folder}/${activeImage}`)
				.done(images => {
				  fullImageList = images;
				  loadMainImage(activeImage);
				  preloadThumbnails(images, activeImage);
				})
				.fail(err => console.error('Failed to load image context', err));
			}

			// ⏬ Initial load
			$(function () {
			  updateThumbnails(currentImage);
			});   
 

			 $(function () {
				const storageKey = 'overlayLineTop';

				const $checkbox = $('#toggleOverlay');
				const $overlayLine = $('#overlayline');

				// Restore saved position if available
				const savedTop = localStorage.getItem(storageKey);
				if (savedTop !== null) {
				  $checkbox.prop('checked', true);
				  $overlayLine.css('top', savedTop + 'px').show();
				} else {
				  $checkbox.prop('checked', false);
				  $overlayLine.hide();
				}

				// Checkbox toggle
				$checkbox.on('change', function () {
				  if (this.checked) {
					$overlayLine.show();
					const currentTop = $overlayLine.position().top;
					localStorage.setItem(storageKey, currentTop);
				  } else {
					$overlayLine.hide();
					localStorage.removeItem(storageKey);
				  }
				});

				// Draggable vertical line
				$overlayLine.draggable({
				  axis: "y",
				  containment: "#viewerContainer",
				  drag: function () {
					// Optional live feedback
				  },
				  stop: function (event, ui) {
					if ($checkbox.is(':checked')) {
					  localStorage.setItem(storageKey, ui.position.top);
					}
				  }
				});
			  });
  
  
  
			$(".star-checkbox").change(function() {
						var recordId = $(this).data("id");
						
						var isChecked = $(this).is(":checked");
						
						// Inject Flask session values (escaped as strings)						
						
						$.ajax({
							url: '/save_bookmark', // Change to your PHP script URL
							method: 'POST',
							contentType: 'application/json',
							data:JSON.stringify({ 						
								book_id: recordId,
								checked: isChecked ? 1 : 0
								
							}),
							success: function(response) {
								console.log("Saved star status:", response);
							},
							error: function() {
								alert("Failed to save star status.");
							}
						});
					})
		  
		});			

		$('#save_record').click(function() {
			const ID = {{ idValue | tojson }};  // Jinja-safe rendering
			let anocode = $("#anocode").val();
			let anscode = $('#anscode').val();
			const proj_type = "{{ proj_type }}";

			anscode = anscode.replace(/(['])/g,"''");
			//anscode = anscode.replace(/([$&+,:;=?@#|"<>.^*()%!-])/g, '\\$1');

			if ((anocode === "A revoir, avec modification de la notice" && anscode === "") ||
				(anocode === "A revoir" && anscode === "")) {
				swal({
					title: "Veuillez ajouter un commentaire!",
					icon: "error"
				});
			} else {
				const keyword = `UPDATE dbo._${proj_type} SET Ano_AnsCode='${anocode}', Ano_Answer='${anscode}' WHERE ID='${ID}'`;

				swal({
					title: "<img src='{{ url_for('static', filename='assets/images/Loading spinner.gif') }}' width='100px'>",
					text: "Chargement...",
					showCancelButton: false,
					showConfirmButton: false,
					html: true,
					customClass: 'swal-wide'
				});

				$.ajax({
					url: "{{ url_for('save_data') }}",
					method: 'POST',
					contentType: 'application/json',
					data: JSON.stringify({ value: keyword, Id: ID }),
					success: function(resp) {
						if (resp.status === 1) {
							swal({
								title: "Enregistré avec succès!",
								icon: "success",
								button: "Ok"
							});
						} else {
							swal({
								title: "Échec de la mise à jour!",
								text: resp.error || "Erreur inconnue",
								icon: "error"
							});
						}
					}
				});
			}
		});
 
    </script>
