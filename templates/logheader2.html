<script>
    document.addEventListener("DOMContentLoaded", function () {
        function updateNotifications() {
            fetch("/notification_count")
                
                .then(response => response.text())
                .then(text => {
                    //alert(parseInt(text.trim()));
                    const count = parseInt(text.trim());
                    const notifpill = document.getElementById("notif-pill");
                    const notifArea = document.getElementById("notif-area");

                    if (notifArea) {
                        if (count > 0) {
                            notifpill.innerHTML = `<strong>${count}</strong>`;
                            notifArea.innerHTML = `<strong>${count}</strong>`;
                        } else {
                            notifArea.innerHTML = `0`;
                        }
                    }
                })
                .catch(error => {
                    console.error("Error fetching notification count:", error);
                });
        }

        updateNotifications();
        setInterval(updateNotifications, 10000);
    });

    }
</script>
