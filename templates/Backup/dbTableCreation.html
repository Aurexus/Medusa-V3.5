<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');


.wrapper {
    height: 100vh;
}

#addRowIcon i {
    font-size: 24px;
    color: white;
    padding: 5px;
}

tr,
th {
    text-align: center;
}

.fixed-height-container {
    height: 70vh;
    overflow: scroll;
    margin: 0.5rem;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1),
        0 2px 4px rgba(0, 0, 0, 0.06);
    border-radius: 10px;
}

/* Add this CSS */
.table tbody tr.highlight {
    background-color: rgba(204, 204, 209, 0.445);; 
}


::after,
::before {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

a {
    text-decoration: none;
}

li {
    list-style: none;
}

h1 {
    font-weight: 600;
    font-size: 1.5rem;
}

body {
    font-family: 'Poppins', sans-serif;
}

.wrapper {
    display: flex;
}

.main {
    min-height: 100vh;
    width: 100%;
    overflow: hidden;
    transition: all 0.35s ease-in-out;
    background-color: #fafbfe;
}

#sidebar {
    width: 70px;
    min-width: 70px;
    z-index: 1000;
    transition: all .25s ease-in-out;
    background-color:#030A76;
    display: flex;
    flex-direction: column;
}

#sidebar.expand {
    width: 260px;
    min-width: 260px;
}

.toggle-btn {
    background-color: transparent;
    cursor: pointer;
    border: 0;
    padding: 1rem 1.5rem;
}

.toggle-btn i {
    font-size: 1.5rem;
    color: #FFF;
}

.sidebar-logo {
    margin: auto 0;
}

.sidebar-logo a {
    color: #FFF;
    font-size: 1.15rem;
    font-weight: 600;
}

#sidebar:not(.expand) .sidebar-logo,
#sidebar:not(.expand) a.sidebar-link span {
    display: none;
}

.sidebar-nav {
    padding: 2rem 0;
    flex: 1 1 auto;
}

a.sidebar-link {
    padding: .625rem 1.625rem;
    color: #FFF;
    display: block;
    font-size: 0.9rem;
    white-space: nowrap;
    border-left: 3px solid transparent;
}

.sidebar-link i {
    font-size: 1.1rem;
    margin-right: .75rem;
}

a.sidebar-link:hover {
    background-color: rgba(255, 255, 255, 0.9);
    border-left: 3px solid #030A76;
    color: black;
}

.sidebar-item {
    position: relative;
}

#sidebar:not(.expand) .sidebar-item .sidebar-dropdown {
    position: absolute;
    top: 0;
    left: 70px;
    background-color: #0e2238;
    padding: 0;
    min-width: 15rem;
    display: none;
}

#sidebar:not(.expand) .sidebar-item:hover .has-dropdown+.sidebar-dropdown {
    display: block;
    max-height: 15em;
    width: 100%;
    opacity: 1;
}

#sidebar.expand .sidebar-link[data-bs-toggle="collapse"]::after {
    border: solid;
    border-width: 0 .075rem .075rem 0;
    content: "";
    display: inline-block;
    padding: 2px;
    position: absolute;
    right: 1.5rem;
    top: 1.4rem;
    transform: rotate(-135deg);
    transition: all .2s ease-out;
}

#sidebar.expand .sidebar-link[data-bs-toggle="collapse"].collapsed::after {
    transform: rotate(45deg);
    transition: all .2s ease-out;
}


/* Default card styles */
.card {
    transition: all 0.3s ease-in-out;
    border-radius: 10px; 
}



/* Ensure text inside the card also inherits the dark blue color on hover */
.card:hover .card-title,
.card:hover .card-text {
    color: white;
    padding: 5px;
    
}

/* Default card styles */
.card-body {
    transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out; 
    background-color: rgb(36, 14, 231); 
    color: white;
}

.card {
    transition: background-color 0.10s ease, color 0.10s ease, box-shadow 0.10s ease, transform 0.10s ease; 
}

</style>
    
</head>

<body>
    <div class="wrapper">
        <aside id="sidebar">
            <div class="d-flex">
                <button class="toggle-btn" type="button">
                    <i class="lni lni-grid-alt"></i>
                </button>
                <div class="sidebar-logo">
                    <img src="Aurexuslogo.png" alt="Logo" class="img-fluid logo" width="60px" height="60px">
                    <a href="#">Medusa</a>
                </div>
               
            </div>
            
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="add_project.html" class="sidebar-link">
                        <i class="lni lni-briefcase"></i>
                        <span>Add Project</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="dbTableCreation.html" class="sidebar-link">
                        <i class="lni lni-add-files"></i>
                        <span>Create Table</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="dbTableEdit.html" class="sidebar-link">
                        <i class="lni lni-pencil-alt"></i>
                        <span>Edit Table</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="lni lni-popup"></i>
                        <span>Notification</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="lni lni-cog"></i>
                        <span>Setting</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="lni lni-exit"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>
        <div class="main p-3">
            <div class="text-center ">
                <div class="p-4">
                    <h1>
                        Welcome, Medusa Users!
                    </h1>
                </div>

                <div class="container">
                    <div class="row">
                        <div class="col-md-4 mb-4">
                            <div class="card">
                                <div class="card-body rounded text-white" style="background-color: #030A76;">
                                    <h5 class="card-title">Total Project</h5>
                                    <p class="card-text">45</p>

                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-4">
                            <div class="card">
                                <div class="card-body rounded text-white" style="background-color:#030A76;">
                                    <h5 class="card-title">Total Client</h5>
                                    <p class="card-text">10</p>

                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-4">
                            <div class="card">
                                <div class="card-body rounded text-white" style="background-color: #030A76;">
                                    <h5 class="card-title">Current Status</h5>
                                    <p class="card-text">10</p>

                                </div>
                            </div>
                        </div>
                    </div>
                    
            </div>
                
                    <!-- Table -->
                    
                    <div class="content-wrap">
                        
                        <div class="main">
                            <div class="container-fluid">
                                <div class="container-fluid fixed-height-container">
                                    <div class="table-responsive mt-3">
                                       
                                        <table class="table">
                                            <thead>
                                                <tr>
                                                    <th class="text-dark">Name</th>
                                                    <th class="text-dark">Data Type</th>
                                                    <th class="text-dark">Req.</th>
                                                    <th class="text-dark">Size</th>
                                                    <th class="text-dark">Display Type</th>
                                                    <th><a id="addRowIcon">
                                                        <i class="bi bi-plus bg-success p-1.8"></i>
                                                    </a></th>
                                                </tr>
                                            </thead>
                                            <tbody id="tableBody">

                                            </tbody>
                                        </table>

                                    </div>
                                </div>
                                <button type="button" class="btn" style="background-color: #030A76; color: white;">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
                

            
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>

   <script>

                const hamBurger = document.querySelector(".toggle-btn");

                hamBurger.addEventListener("click", function () {
                document.querySelector("#sidebar").classList.toggle("expand");
                });

                document.addEventListener('DOMContentLoaded', function() {
                const table = document.querySelector('.table');
                
                // Add hover effect
                table.addEventListener('mouseover', function(event) {
                    const cell = event.target.closest('td');
                    if (cell) {
                        const row = cell.parentElement;
                        row.classList.add('highlight');
                    }
                });

                // Remove hover effect
                table.addEventListener('mouseout', function(event) {
                    const cell = event.target.closest('td');
                    if (cell) {
                        const row = cell.parentElement;
                        row.classList.remove('highlight');
                    }
                });

                // Existing code for adding rows
                document.getElementById('addRowIcon').addEventListener('click', function() {
                    const newRow = document.createElement('tr');
                    newRow.innerHTML = `
                        <td><input type="text" class="form-control" placeholder="Enter name"></td>
                        <td>
                            <select class="form-select btn btn-white p-2 dropdown-toggle" aria-haspopup="true" aria-expanded="false">
                                <option value="option1">Text</option>
                                <option value="option2">Number</option>
                                <option value="option3">Integra</option>
                                <option value="option3">Float</option>
                                <option value="option3">Float</option>
                            </select>
                        </td>
                        <td>
                            <div>
                                <input type="checkbox" id="checkbox1">
                            </div>
                        </td>
                        <td><input type="text" class="form-control" placeholder="Enter size"></td>
                        <td>
                            <select class="form-select btn btn-white p-2 dropdown-toggle" aria-haspopup="true" aria-expanded="false">
                                <option value="option1">Text</option>
                                <option value="option2">Number</option>
                                <option value="option3">Integra</option>
                                <option value="option3">Float</option>
                                <option value="option3">Float</option>
                            </select>
                        </td>
                        <td class="text-center align-middle"><a>
                            <i class="bi bi-trash remove-icon bg-danger p-2 "></i>
                        </a></td> 
                    `;

                    document.getElementById('tableBody').appendChild(newRow);

                    newRow.querySelector('.remove-icon').addEventListener('click', function() {
                        newRow.remove();
                    });
                });
                });


   </script>
    
    
</body>

</html>
