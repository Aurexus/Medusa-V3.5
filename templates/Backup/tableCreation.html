<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .wrapper {
            height: 100vh;
            display: flex;
        }
       
        .main {
            min-height: 100vh;
            width: 100%;
            overflow: hidden;
            transition: all 0.35s ease-in-out;
            background-color: #fafbfe;
        }

        #sidebar {
            width: 70px;
            min-width: 70px;
            z-index: 1000;
            transition: all .25s ease-in-out;
            background-color:#030A76;
            display: flex;
            flex-direction: column;
        }

        #sidebar.expand {
            width: 260px;
            min-width: 260px;
        }

        .toggle-btn {
            background-color: transparent;
            cursor: pointer;
            border: 0;
            padding: 1rem 1.5rem;
        }

        .toggle-btn i {
            font-size: 1.5rem;
            color: #FFF;
        }

        .sidebar-logo {
            margin: auto 0;
        }

        .sidebar-logo a {
            color: #FFF;
            font-size: 1.15rem;
            font-weight: 600;
        }

        #sidebar:not(.expand) .sidebar-logo,
        #sidebar:not(.expand) a.sidebar-link span {
            display: none;
        }

        .sidebar-nav {
            padding: 2rem 0;
            flex: 1 1 auto;
        }

        a.sidebar-link {
            padding: .625rem 1.625rem;
            color: #FFF;
            display: block;
            font-size: 0.9rem;
            white-space: nowrap;
            border-left: 3px solid transparent;
        }

        .sidebar-link i {
            font-size: 1.1rem;
            margin-right: .75rem;
        }

        a.sidebar-link:hover {
            background-color: rgba(255, 255, 255, 0.9);
            border-left: 3px solid #030A76;
            color: black;
        }

        .sidebar-item {
            position: relative;
        }

        #sidebar:not(.expand) .sidebar-item .sidebar-dropdown {
            position: absolute;
            top: 0;
            left: 70px;
            background-color: #0e2238;
            padding: 0;
            min-width: 15rem;
            display: none;
        }

        #sidebar:not(.expand) .sidebar-item:hover .has-dropdown+.sidebar-dropdown {
            display: block;
            max-height: 15em;
            width: 100%;
            opacity: 1;
        }

        #sidebar.expand .sidebar-link[data-bs-toggle="collapse"]::after {
            border: solid;
            border-width: 0 .075rem .075rem 0;
            content: "";
            display: inline-block;
            padding: 2px;
            position: absolute;
            right: 1.5rem;
            top: 1.4rem;
            transform: rotate(-135deg);
            transition: all .2s ease-out;
        }

        #sidebar.expand .sidebar-link[data-bs-toggle="collapse"].collapsed::after {
            transform: rotate(45deg);
            transition: all .2s ease-out;
        }

        .container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            height:95vh;
            box-sizing: border-box;
           
        }

        #columns{
            max-height: 600px;
            overflow-y: auto;
            overflow-x:hidden;
        }

        .column-row {
            margin-bottom: 10px;
        }
        .remove-btn {
            margin-top: 6px;
        }
        .sql-preview {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-wrap;
        }




       

</style>
    
</head>

<body>
    <div class="wrapper">
        <aside id="sidebar">
            <div class="d-flex">
                <button class="toggle-btn" type="button">
                    <i class="lni lni-grid-alt"></i>
                </button>
                <div class="sidebar-logo">
                    <img src="Aurexuslogo.png" alt="Logo" class="img-fluid logo" width="60px" height="60px">
                    <a href="#">Medusa</a>
                </div>
               
            </div>
            
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="add_project.html" class="sidebar-link">
                        <i class="lni lni-briefcase"></i>
                        <span>Add Project</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="dbTableCreation.html" class="sidebar-link">
                        <i class="lni lni-add-files"></i>
                        <span>Create Table</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="dbTableEdit.html" class="sidebar-link">
                        <i class="lni lni-pencil-alt"></i>
                        <span>Edit Table</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="lni lni-popup"></i>
                        <span>Notification</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="lni lni-cog"></i>
                        <span>Setting</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="lni lni-exit"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>
        <div class="main p-3">
            <div class="container my-1 p-4 shadow-container">
                <h5 class="mb-2">Create New Table</h5>
                  
                <!-- Table Name Input -->
                <div class="mb-4">
                    <input type="text" id="tableName" class="form-control" placeholder="e.g., users" oninput="updateSQL()">
                </div>
                  
                <!-- Columns -->
                <div id="columns" ></div>
                  
                <button class="btn btn-primary mb-3" onclick="addColumn()">+ Add Column</button>

                <!-- Buttons -->
                <div class="mb-4 text-end">
                    <button class="btn btn-secondary">Cancel</button>
                    <button class="btn btn-primary">Create Table</button>
                </div>
                  
                    <!-- SQL Preview -->
                <h5>SQL Preview</h5>
                <div id="sqlPreview" class="sql-preview">-- Invalid table name</div> 
            </div>  
        </div>
    </div>
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous">
    </script>


   <script>

        const hamBurger = document.querySelector(".toggle-btn");
            hamBurger.addEventListener("click", function () {
            document.querySelector("#sidebar").classList.toggle("expand");
        });

        // Create table
        let columnCount = 0;

        function addColumn() {
        const columnsDiv = document.getElementById('columns');

        const row = document.createElement('div');
        row.className = 'row column-row align-items-center';
        row.id = `column-${columnCount}`;

        row.innerHTML = `
            <div class="col-4">
            <input type="text" class="form-control" placeholder="Name" oninput="updateSQL()">
            </div>
            <div class="col-3">
            <select class="form-select" onchange="updateSQL()">
                <option value="INT">INT</option>
                <option value="VARCHAR(255)">VARCHAR(255)</option>
                <option value="TEXT">TEXT</option>
                <option value="DATE">DATE</option>
                <option value="BOOLEAN">BOOLEAN</option>
            </select>
            </div>
            <div class="col-2">
            <input type="text" class="form-control" placeholder="Default" oninput="updateSQL()">
            </div>
            <div class="col-1 form-check form-check">
            <input class="form-check-input" type="checkbox" onchange="updateSQL()"> Null
            </div>
            <div class="col-1 form-check form-check">
            <input class="form-check-input" type="checkbox" onchange="updateSQL()"> Unique
            </div>
            <div class="col-1">
            <button class="btn btn-danger btn-sm remove-btn" onclick="removeColumn('${row.id}')">
                &times;
            </button>
            </div>
        `;

        columnsDiv.appendChild(row);
        columnCount++;
        updateSQL();
        }

        function removeColumn(id) {
        document.getElementById(id).remove();
        updateSQL();
        }

        function updateSQL() {
        const tableName = document.getElementById('tableName').value.trim();
        const columnsDiv = document.getElementById('columns');
        const columnRows = columnsDiv.querySelectorAll('.column-row');

        if (!tableName) {
            document.getElementById('sqlPreview').innerText = "-- Invalid table name";
            return;
        }

        if (columnRows.length === 0) {
            document.getElementById('sqlPreview').innerText = "-- Add at least one column";
            return;
        }

        let columnsSQL = [];
        columnRows.forEach(row => {
            const inputs = row.querySelectorAll('input, select');
            const name = inputs[0].value.trim();
            const type = inputs[1].value;
            const def = inputs[2].value.trim();
            const isNull = inputs[3].checked;
            const isUnique = inputs[4].checked;

            if (!name) return;

            let colSQL = `\`${name}\` ${type}`;
            if (def) colSQL += ` DEFAULT '${def}'`;
            if (!isNull) colSQL += ` NOT NULL`;
            if (isUnique) colSQL += ` UNIQUE`;

            columnsSQL.push(colSQL);
        });

        if (columnsSQL.length === 0) {
            document.getElementById('sqlPreview').innerText = "-- Add valid column names";
            return;
        }

        const sql = `CREATE TABLE \`${tableName}\` (\n  ${columnsSQL.join(',\n  ')}\n);`;
        document.getElementById('sqlPreview').innerText = sql;
        }
   </script>
</body>

</html>
