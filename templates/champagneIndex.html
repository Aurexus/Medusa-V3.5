<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AUREXUS</title>
    <link rel="shortcut icon" href="http://placehold.it/64.png/000/fff">
    <link rel="apple-touch-icon" sizes="144x144" href="http://placehold.it/144.png/000/fff">
    <link rel="apple-touch-icon" sizes="114x114" href="http://placehold.it/114.png/000/fff">
    <link rel="apple-touch-icon" sizes="72x72" href="http://placehold.it/72.png/000/fff">
    <link rel="apple-touch-icon" sizes="57x57" href="http://placehold.it/57.png/000/fff">
    <link href="{{url_for('static',filename='assets/css/lib/calendar2/pignose.calendar.min.css')}}" rel="stylesheet">
    <link href="{{url_for('static',filename='assets/css/lib/chartist/chartist.min.css')}}" rel="stylesheet">
    <link href="{{url_for('static',filename='assets/css/lib/font-awesome.min.css')}}" rel="stylesheet">
    <link href="{{url_for('static',filename='assets/css/lib/themify-icons.css')}}" rel="stylesheet">
    <link href="{{url_for('static',filename='assets/css/lib/owl.carousel.min.css')}}" rel="stylesheet" />
    <link href="{{url_for('static',filename='assets/css/lib/owl.theme.default.min.css')}}" rel="stylesheet" />
    <link href="{{url_for('static',filename='assets/css/lib/weather-icons.css')}}" rel="stylesheet" />
    <link href="{{url_for('static',filename='assets/css/lib/menubar/sidebar.css')}}" rel="stylesheet">
    <link href="{{url_for('static',filename='assets/css/lib/bootstrap.min.css')}}" rel="stylesheet">
    <link href="{{url_for('static',filename='assets/css/lib/helper.css')}}" rel="stylesheet">
    <link href="{{url_for('static',filename='assets/css/style.css')}}" rel="stylesheet">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 0;
        }

        .content-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content-wrapper {
            display: flex;
            gap: 24px;
            padding: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* --- Column structure --- */
        .left-section {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .right-section {
            flex: 2;
            min-width: 420px;
        }

        /* --- Card --- */
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(3, 10, 118, 0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 20px;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(3, 10, 118, 0.12);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-header h5 {
            font-size: 18px;
            font-weight: 600;
            color: #030A76;
            margin: 0;
        }

        .card-header .icon {
            font-size: 22px;
        }

        /* --- Counter cards --- */
        #chart-counter,
        #totalImage {
            font-size: 30px;
            font-weight: bold;
            color: #030A76;
            text-align: center;
        }

        .range-label {
            font-weight: 600;
            color: #444;
            margin-top: 5px;
            text-align: center;
        }

        /* --- Table styles --- */
        h2 {
            color: #030A76;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        table th,
        table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e8ecf8;
            text-align: left;
			color: #030A76;
			font-size: 14px;
        }

        table th {
            background-color: #f0f3ff;
            color: #030A76;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
        }

        table tbody tr:nth-child(even) {
            background-color: #fafbff;
        }

        table tbody tr:hover {
            background-color: #eef2ff;
        }

        /* --- Responsive --- */
        @media (max-width: 992px) {
            .main-content-wrapper {
                flex-direction: column;
                padding: 20px;
            }

            .left-section, .right-section {
                max-width: 100%;
            }

            h2 {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 16px;
            }

            table th, table td {
                font-size: 13px;
                padding: 8px;
            }
        }
		  #chart-counter {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			font-size: 28px;
			font-weight: bold;
			color: #030A76;
			font-family: sans-serif;
			pointer-events: none;
		}

		#totalImage{
			font-size: 28px;
			font-weight: bold;
			color: #030A76;
			font-family: sans-serif;
			pointer-events: none;
		}

    </style>
</head>

<body>

    {% include 'logheader2.html' %}

    <div class="content-wrap" style="background-color: #F8FAFE;">
        <div class="main-content-wrapper">

            <!-- Left Section -->
            <div class="left-section">
                <!-- Total Dossiers -->
                <div class="card">
                    <div class="card-header">
                        <h5>Nombre total de dossiers</h5>
                        <div class="icon">📦</div>
                    </div>
                    <div class="card-body" style="position: relative; height: 220px;">
                        <canvas id="counterChart"></canvas>
                        <div id="chart-counter">621</div>
                    </div>
                </div>

                <!-- Total Images -->
                <div class="card">
                    <div class="card-header">
                        <h5>Nombre total de fichiers</h5>
                        <div class="icon">🖼️</div>
                    </div>
                    <div class="card-body" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <div id="totalImage">300000</div>
                        <div class="range-label">Images</div>
                    </div>
                </div>
            </div>

            <!-- Right Section -->
            <div class="right-section">
                <div class="card">
                    <h2>Résumé</h2>
                    <table id="summary">
                        <tr>
                            <th></th>
                            <th>Images</th>
                            <th>Registres</th>
                        </tr>
                    </table>

                    <h2 class="mt-4">Datas</h2>
                    <table id="data">
                        <tr>
                            <th></th>
                            <th>Numérisés</th>
                            <th>Traités</th>
                            <th>En cours</th>
                            <th>Livrés FTP/Médusa</th>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Dependencies -->
    <script src="{{ url_for('static', filename='assets/js/lib/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/lib/bootstrap.min.js') }}"></script>

    <script>
        // Counter Chart
        const done = 100;
        const remaining = 100 - done;
        const ctx = document.getElementById("counterChart").getContext("2d");

        const gradientDone = ctx.createLinearGradient(0, 0, 300, 300);
        gradientDone.addColorStop(0, "#030A76");
        gradientDone.addColorStop(1, "#4B65FF");

        const gradientTodo = ctx.createLinearGradient(0, 0, 0, 300);
        gradientTodo.addColorStop(0, "#C8D1FF");
        gradientTodo.addColorStop(1, "#E6EBFF");

        new Chart(ctx, {
            type: "doughnut",
            data: {
                labels: ["Done", "Remaining"],
                datasets: [{
                    data: [done, remaining],
                    backgroundColor: [gradientDone, gradientTodo],
                    borderWidth: 0,
                    cutout: "75%"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                }
            }
        });

        // Load Summary Data
        function loadData() {
            $.getJSON("{{ url_for('imageapp.stats') }}", function(res) {
                let s = res.summary;
                let d = res.data;

                $("#summary").html(`
                    <tr><th></th><th>Images</th><th>Registres</th></tr>
                    <tr><td>A faire</td><td>${s.total_images}</td><td>${s.total_registers}</td></tr>
                    <tr><td>Livrable</td><td>${s.livrable_images}</td><td>${s.livrable_registers}</td></tr>
                    <tr><td>Reste à faire</td><td>${s.remaining_images}</td><td>${s.remaining_registers}</td></tr>
                    <tr><td>% Fait</td><td><span class="badge badge-xl badge-success">${s.percent_done}%</span></td><td></td></tr>
                `);

                $("#data").html(`
                    <tr><th></th><th>Numérisés</th><th>Traités</th><th>En cours</th><th>Livrés FTP/Médusa</th></tr>
                    <tr><td>Dossiers</td><td>${d.dossiers_scanned}</td><td>${d.dossiers_processed}</td><td>${d.dossiers_in_progress}</td><td>${d.files_delivered || "-"}</td></tr>
                    <tr><td>Images</td><td>${d.images_scanned}</td><td>${d.images_processed}</td><td>${d.images_in_progress}</td><td>${d.files_delivered || "-"}</td></tr>
                    <tr><td>Ratio Scan/Livrable</td><td>${d.ratio_scan_livrable}</td><td></td><td></td><td></td></tr>
                `);
            });
        }

        loadData();
//setInterval(loadData, 5000);
    </script>
</body>
</html>
