   <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f8fafe;
        margin: 0;
        padding: 0;
    }

    .main-content-wrapper {
        display: flex;
        gap: 20px;
        padding: 20px;
        box-sizing: border-box;
        min-height: calc(100vh - 60px);
        flex-wrap: wrap; /* allows stacking on smaller screens */
    }

    .left-section,
    .right-section {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .left-section {
        flex: 1;
        min-width: 320px;
        max-width: 450px;
    }

    /* .right-section {
        flex: 2;
        min-width: 350px;
    } */

    .card {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .card-header h5 {
        margin: 0;
        font-size: 18px;
        color: #333;
    }

    .card-header .icon {
        font-size: 22px;
        color: #030A76;
    }

    .card-body {
        font-size: 16px;
        color: #333;
    }

    .card-body canvas {
        width: 100% !important;
        height: 200px !important;
    }

    #chart-counter {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-weight: bold;
        color: #030A76;
        font-family: sans-serif;
        pointer-events: none;
    }

    .card-body.center-align {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 150px;
    }

    .progress-container {
        width: 80%;
        max-width: 300px;
        background-color: #e6e6e6;
        border-radius: 20px;
        overflow: hidden;
        height: 30px;
        position: relative;
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #030A76, #4681f4);
        width: 100%;
        animation: fillBar 2s ease-in-out;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        transition: width 0.6s ease;
    }

    .range-label {
        text-align: center;
        margin-top: 10px;
        color: #555;
        font-size: 14px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
    }

    table th, table td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
        text-align: left;
        white-space: nowrap;
    }

    table th {
        background-color: #e8ecf8;
        font-weight: bold;
        color: #030A76;
        text-transform: uppercase;
        font-size: 14px;
    }

    table tbody tr:hover {
        background-color: #f5f5f5;
    }

    .card-body table {
        overflow-x: auto;
        display: block;
    }

    /* Responsive breakpoints */
    @media (max-width: 992px) {
        .main-content-wrapper {
            flex-direction: column;
        }
        .left-section, .right-section {
            width: 100%;
            max-width: 100%;
        }
    }

    @media (max-width: 768px) {
        .card {
            padding: 15px;
        }

        .card-header h5 {
            font-size: 16px;
        }

        .card-body {
            font-size: 14px;
        }

        #chart-counter {
            font-size: 22px;
        }

        table th, table td {
            padding: 10px;
            font-size: 13px;
        }
    }

    @media (max-width: 480px) {
        .progress-container {
            width: 100%;
            max-width: none;
        }

        table {
            font-size: 13px;
        }

        table th, table td {
            padding: 8px;
        }

        .card-body {
            overflow-x: auto;
        }
    }

    <script>
    // Counter chart
    const done = 75;
    const remaining = 100 - done;

    const ctx = document.getElementById("counterChart").getContext("2d");

    const gradientDone = ctx.createLinearGradient(0, 0, 300, 300);
    gradientDone.addColorStop(0, "#030A76");
    gradientDone.addColorStop(1, "#4B65FF");

    const gradientTodo = ctx.createLinearGradient(0, 0, 0, 300);
    gradientTodo.addColorStop(0, "#C8D1FF");
    gradientTodo.addColorStop(1, "#E6EBFF");

    new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Done", "Remaining"],
        datasets: [
          {
            data: [done, remaining],
            backgroundColor: [gradientDone, gradientTodo],
            borderWidth: 0,
            cutout: "75%"
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false }
        }
      }
    });
	$(document).ready(function() {
		// Load data from Flask endpoint after page load
		$.ajax({
			url: '/imageapp/get_dossier_data',
			type: 'GET',
			dataType: 'json',
			success: function(data) {
				let rows = '';
				data.forEach(function(item) {
					rows += `<tr>
						<td>${item.dossier}</td>
						<td>${item.image_count}</td>
					</tr>`;
				});
				$('#dossier-table-body').html(rows);
			},
			error: function(xhr, status, error) {
				console.error('Error fetching data:', error);
			}
		});
	});
    </script>
