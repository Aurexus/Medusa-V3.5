              <div class="step" data-title="Stage 6" data-stage="6" data-folder="20A01" data-img="img_3.png" data-trait="ENRICHISSEMENT">6</div>

  <!-- Image Fullscreen Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">

    <!-- jquery vendor -->

    <script src="{{url_for('static',filename='assets/js/lib/jquery.min.js')}}"></script>

   <script>
   
  const staticBase = "{{ url_for('static', filename='images/') }}";
  document.querySelectorAll('.step').forEach(step => {
    step.addEventListener('click', () => {
      const stage = step.getAttribute('data-stage');
      const folder = step.getAttribute('data-folder');
      const image = step.getAttribute('data-img');
      const traitement = step.getAttribute('data-trait');
      const detailPanel = document.getElementById('detail-content');

      const imagePath = image ? `${staticBase}${image}` : null;

      let content = `
        <div class="stage-card text-start">
          <h5>Stage ${stage}</h5>
          <p><strong>Folder:</strong> ${folder}</p>
          <p><strong>Traitement:</strong> ${traitement}</p>
      `;

      // Always show image if available
      if (imagePath) {
        content += `
          <img src="${imagePath}" alt="Stage Image" width="150px" height="150px" class="clickable-img rounded shadow mb-3" />
        `;
      }

      // Stage 3 and 4: OCR textarea
      if (stage === '3' || stage === '4') {
        content += `
          <label><strong>OCR Content:</strong></label>
          <textarea class="form-control mb-2" rows="4" style="height:150px; width:100%;" placeholder="Dummy OCR text here..."></textarea>
        `;
      }

      // Stage 5 and 6: OCR textarea + notice
      if (stage === '5' || stage === '6') {
        content += `
          <label><strong>OCR Content:</strong></label>
          <textarea class="form-control mb-2" rows="4" style="height:150px" placeholder="Dummy OCR text here..."></textarea>
          <textarea class="form-control mb-2" rows="4" style="height:150px" placeholder="Notices"></textarea>
          
        `;
      }

      content += `</div>`;
      detailPanel.innerHTML = content;

      const img = detailPanel.querySelector('.clickable-img');
      if (img) {
        img.addEventListener('click', () => {
          openCustomModal(imagePath);
        });
      }
    });
  });
  //  Custom Fullscreen Modal (without Bootstrap)
    function openCustomModal(imgSrc) {
      const existing = document.getElementById('customFullModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'customFullModal';
      modal.style.cssText = `
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
      `;
      modal.innerHTML = `
        <img src="${imgSrc}" style="max-width: 90%; max-height: 90%;" />
        <button style="
          position: absolute; top: 20px; right: 30px;
          background: #fff;color:black; border: none; padding: 5px 10px;
          font-size: 18px; cursor: pointer; border-radius: 4px;
        " onclick="document.getElementById('customFullModal').remove()">✖</button>
      `;
      document.body.appendChild(modal);
    }
</script>
