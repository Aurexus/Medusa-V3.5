	<style>
	

h1 {
    font-weight: 600;
    font-size: 1.5rem;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed; /* Ensures that the table layout is consistent */
}

thead {
    position: sticky;
    top: 0;
    background-color: #f8f9fa; /* Header background color */
    z-index: 2;
}

thead th, tbody td {
    padding: 3px;
    text-align: center;
    border-bottom: 1px solid #ddd; /* Adds border to table cells */
	font-size: 13px;
	width: 12.5%; /* Example width for 8 columns */
   
}

tbody {
    display: block;
    max-height: 600px; /* Matches container’s max-height */
    overflow-y: auto; /* Makes tbody scrollable */
}

tbody tr {
    display: table;
    width: 100%;
    table-layout: fixed; /* Ensures consistent column width */
}

thead tr {
    display: table;
    width: 100%;
    table-layout: fixed; /* Ensures consistent column width */
}
[contenteditable]:hover, [contenteditable]:focus {
    padding-top: 10px !important;
    background: #ffffff !important;
    padding-bottom: 10px !important;
    border: 1px solid black !important;
}
.form-group {
    margin-bottom: 0px !important;
	margin-top: 0px !important;
}
label{
	display:inline !important;
}
